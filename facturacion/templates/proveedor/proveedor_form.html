<div class="modal fade" id="modalCrearProveedor" tabindex="-1" role="dialog" aria-labelledby="modalProveedorLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header bg-info text-dark">
        <h5 class="modal-title font-weight-normal" id="modalProveedorLabel">Registrar Nuevo Proveedor</h5>
        <button type="button" class="btn-close text-dark" data-bs-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form method="POST" action="{% url 'crear_proveedor' %}">
          {% csrf_token %}
          
          <div class="row">
            <div class="col-md-4">
              <div class="input-group input-group-static mb-4">
                <label>RIF / Cédula</label>
                <input type="text" name="rif_cedula" class="form-control" placeholder="Ej: J-12345678-0" required>
              </div>
            </div>
            <div class="col-md-8">
              <div class="input-group input-group-static mb-4">
                <label>Nombre / Razón Social</label>
                <input type="text" name="nombre_razon_social" class="form-control" placeholder="Nombre de la empresa o persona" required>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="input-group input-group-static mb-4">
                <label>Correo Electrónico</label>
                <input type="email" name="email" class="form-control" placeholder="ejemplo@correo.com">
              </div>
            </div>
            <div class="col-md-6">
              <div class="input-group input-group-static mb-4">
                <label>Teléfono</label>
                <input type="text" name="telefono" class="form-control" placeholder="Ej: +58 412-1234567">
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-12">
              <div class="input-group input-group-static mb-4">
                <label>Dirección</label>
                <textarea name="direccion" class="form-control" rows="2" placeholder="Ubicación física del proveedor..."></textarea>
              </div>
            </div>
          </div>

          <div class="form-check form-switch d-flex align-items-center mb-3">
            <input class="form-check-input" type="checkbox" id="activo" name="activo" checked>
            <label class="form-check-label mb-0 ms-3" for="activo">Proveedor activo</label>
          </div>

          <div class="modal-footer px-0">
            <button type="button" class="btn btn-link ml-auto" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn bg-gradient-info">Guardar Proveedor</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
