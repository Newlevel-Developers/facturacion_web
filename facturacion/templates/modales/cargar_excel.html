<div class="modal fade" id="modalCargarExcel" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title text-white"><i class="fas fa-file-excel me-2"></i>Importar Productos</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form action="{% url 'importar_productos_excel' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="modal-body">
          <p class="text-xs text-secondary mb-3">
            El archivo debe ser un Excel (<strong>.xlsx</strong>) con el orden: <br>
            <code>Nombre | SKU | Precio Venta | Stock</code>
          </p>
          <div class="mb-3">
            <label class="form-label">Seleccionar archivo Excel</label>
            <input type="file" name="archivo_excel" class="form-control" accept=".xlsx, .xls" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="fas fa-upload me-1"></i> Cargar</button>
        </div>
      </form>
    </div>
  </div>
</div>
