<div class="modal fade" id="EditarProductoModal{{ producto.id }}" tabindex="-1" role="dialog" aria-labelledby="modalProductoLabel{{ producto.id }}" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header bg-info text-dark">
        <h5 class="modal-title font-weight-normal" id="modalProductoLabel{{ producto.id }}">Editar Producto</h5>
        <button type="button" class="btn-close text-dark" data-bs-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <!-- 1. Pasamos el id del producto en la URL -->
        <form method="POST" action="{% url 'editar_producto' producto.id %}" enctype="multipart/form-data">
          {% csrf_token %}
          
          <div class="row">
            <div class="col-md-4">
              <div class="input-group input-group-static mb-4">
                <label>Código de Producto</label>
                <!-- 2. Agregamos value con los datos actuales -->
                <input type="text" name="codigo" class="form-control" value="{{ producto.codigo }}" required>
              </div>
            </div>
            <div class="col-md-8">
              <div class="input-group input-group-static mb-4">
                <label>Nombre del Producto</label>
                <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="input-group input-group-static mb-4">
                <label for="categoria{{ producto.id }}" class="ms-0">Categoría</label>
                <select class="form-control" id="categoria{{ producto.id }}" name="categoria" required>
                  <option value="" disabled>Seleccione una categoría</option>
                  {% for cat in categorias %}
                    <!-- 3. Marcamos selected si coincide con la categoría del producto -->
                    <option value="{{ cat.id }}" {% if cat.id == producto.categoria.id %}selected{% endif %}>
                      {{ cat.nombre }}
                    </option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="input-group input-group-static mb-4">
                <label>Imagen del Producto</label>
                <input type="file" name="imagen" class="form-control">
                {% if producto.imagen %}
                  <small class="text-muted d-block mt-1">Actual: {{ producto.imagen.name }}</small>
                {% endif %}
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="input-group input-group-static mb-4">
                <label>Precio Compra ($)</label>
                <input type="number" step="0.01" name="precio_compra" class="form-control" value="{{ producto.precio_compra|stringformat:'.2f' }}" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="input-group input-group-static mb-4">
                <label>Precio Venta ($)</label>
                <input type="number" step="0.01" name="precio_venta" class="form-control" value="{{ producto.precio_venta|stringformat:'.2f' }}" required>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="input-group input-group-static mb-4">
                <label>Stock Actual</label>
                <input type="number" name="stock" class="form-control" value="{{ producto.stock }}" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="input-group input-group-static mb-4">
                <label>Stock Mínimo (Alerta)</label>
                <input type="number" name="stock_minimo" class="form-control" value="{{ producto.stock_minimo }}" required>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-12">
              <div class="input-group input-group-static mb-4">
                <label>Descripción</label>
                <!-- 4. El contenido de textarea va dentro de las etiquetas, no en value -->
                <textarea name="descripcion" class="form-control" rows="2">{{ producto.descripcion }}</textarea>
              </div>
            </div>
          </div>

          <div class="form-check form-switch d-flex align-items-center mb-3">
            <!-- 5. Condicional para marcar el checkbox si está activo -->
            <input class="form-check-input" type="checkbox" id="activo{{ producto.id }}" name="activo" {% if producto.activo %}checked{% endif %}>
            <label class="form-check-label mb-0 ms-3" for="activo{{ producto.id }}">Producto activo para la venta</label>
          </div>

          <div class="modal-footer px-0">
            <button type="button" class="btn btn-link ml-auto" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn bg-gradient-info">Actualizar Producto</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
